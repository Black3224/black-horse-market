<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Horse Star Market</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #f1c40f;
            --accent-color: #e74c3c;
            --bg-color: #0f172a;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 60px;
        }
        h1 { margin: 10px 0; color: var(--secondary-color); }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-telebirr { background-color: #0084ff; color: white; }
        .btn-crypto { background-color: #f59e0b; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🐎</div>
        <h1>Black Horse Star Market</h1>
        <p>Buy & Sell Telegram Stars Instantly</p>
    </div>
    
    <div class="card">
        <h3>Select Payment Method</h3>
        <button class="btn btn-telebirr" onclick="alert('Telebirr payment selected for Black Horse Market!')">Pay with Telebirr 🇪🇹</button>
        <button class="btn btn-crypto" onclick="alert('Crypto payment selected for Black Horse Market!')">Pay with Crypto 🪙</button>
    </div>
</body>
</html>
