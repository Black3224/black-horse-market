<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Horse Star Market</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-color: #f39c12;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo { font-size: 30px; }
        .title h2 { margin: 0; font-size: 18px; color: var(--text-color); }
        .title h2 span { color: var(--accent-color); }
        .title p { margin: 0; font-size: 12px; color: var(--text-muted); }

        .lang-selector {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .notice-banner {
            background: rgba(243, 156, 18, 0.1);
            border: 1px solid rgba(243, 156, 18, 0.3);
            color: var(--accent-color);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; display: block; }
        
        .input-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-color);
            font-size: 16px;
        }

        .grid-stars {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .star-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }
        .star-btn.active {
            border-color: var(--accent-color);
            background: rgba(243, 156, 18, 0.15);
            color: var(--accent-color);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .summary-row span:last-child { font-weight: bold; color: var(--accent-color); }

        .btn-main {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            width: 100%;
            max-width: 420px;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item.active { color: var(--accent-color); }
        .nav-item div { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo">🐎</div>
            <div class="title">
                <h2>Star<span>Market</span></h2>
                <p>Black Horse Global</p>
            </div>
        </div>
        <select class="lang-selector" id="langSelect" onchange="changeLanguage()">
            <option value="am">አማርኛ</option>
            <option value="or">Afaan Oromoo</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="notice-banner" id="bannerText">
        ⚡ ከዋክብት ክፍያ ከተፈጸመ በ 0~5 ደቂቃ ውስጥ ይደርሳሉ
    </div>

    <!-- Target User Input -->
    <div class="card">
        <label class="label" id="lblTarget">ኮከቦቹን ማისთვის ይልኩ (የቴሌግራም ዩዘርናም)</label>
        <div class="input-box">
            <input type="text" id="usernameInput" placeholder="username (e.g. @username)" style="background:none; border:none; color:white; width:100%; outline:none; font-size:14px;">
        </div>
    </div>

    <!-- Star Quantity Selection -->
    <div class="card">
        <label class="label" id="lblQty">የኮከብ ብዛት (max 5,000)</label>
        <div class="input-box">
            <span id="selectedStarCount">50</span> ⭐
        </div>
        <div class="grid-stars">
            <div class="star-btn active" onclick="setStars(50)">50</div>
            <div class="star-btn" onclick="setStars(100)">100</div>
            <div class="star-btn" onclick="setStars(150)">150</div>
            <div class="star-btn" onclick="setStars(300)">300</div>
            <div class="star-btn" onclick="setStars(500)">500</div>
            <div class="star-btn" onclick="setStars(1000)">1,000</div>
            <div class="star-btn" onclick="setStars(2000)">2,000</div>
            <div class="star-btn" onclick="setStars(5000)">5,000</div>
        </div>
    </div>

    <!-- Price Calculation Card -->
    <div class="card">
        <div class="summary-row">
            <span id="txtStarsLabel">ኮከቦች</span>
            <span id="summaryStars">50 ⭐</span>
        </div>
        <div class="summary-row">
            <span id="txtRateLabel">ዋጋ በ 1 ኮከብ</span>
            <span>3.81 ETB / ⭐</span>
        </div>
        <hr style="border:0; border-top:1px solid var(--border-color); margin:10px 0;">
        <div class="summary-row" style="font-size:16px;">
            <span id="txtTotalLabel">የሚከፍሉት</span>
            <span id="totalPrice">191 ETB</span>
        </div>
    </div>

    <!-- Payment Gateways (CBE & Crypto) -->
    <div class="card">
        <label class="label" id="lblPaymentMethod">የክፍያ አማራጭ ይምረጡ / Filannoo Kaffaltii</label>
        <button class="star-btn" style="width:100%; margin-bottom:8px; background:#1e293b; text-align:left; padding:12px;" onclick="alert('CBE (Commercial Bank of Ethiopia) selected. Account: 1000xxxxxxxx')">
            🏦 CBE (Commercial Bank of Ethiopia) 🇪🇹
        </button>
        <button class="star-btn" style="width:100%; background:#1e293b; text-align:left; padding:12px;" onclick="alert('Crypto (USDT/Binance/Bybit) selected.')">
            🪙 Crypto (USDT / Binance / Bybit) 🌐
        </button>
    </div>

    <button class="btn-main" id="btnPayNow" onclick="alert('Processing Payment...')">ክፍያፈጽም / Kaffali</button>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <div>🛒</div>
            <span id="navShop">ገበያ</span>
        </div>
        <div class="nav-item">
            <div>📄</div>
            <span id="navOrders">ትዕዛዞች</span>
        </div>
        <div class="nav-item">
            <div>🎁</div>
            <span id="navInvite">ጋብዝ</span>
        </div>
        <div class="nav-item">
            <div>👤</div>
            <span id="navProfile">መለያ</span>
        </div>
    </div>

    <script>
        let currentStars = 50;
        const ratePerStar = 3.81;

        function setStars(count) {
            currentStars = count;
            document.getElementById('selectedStarCount').innerText = count;
            document.getElementById('summaryStars').innerText = count + " ⭐";
            
            let total = Math.round(count * ratePerStar);
            document.getElementById('totalPrice').innerText = total.toLocaleString() + " ETB";

            // Update active button styling
            let buttons = document.querySelectorAll('.star-btn');
            buttons.forEach(btn => {
                if(btn.innerText.replace(/,/g, '') == count) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function changeLanguage() {
            let lang = document.getElementById('langSelect').value;
            let banner = document.getElementById('bannerText');
            let lblTarget = document.getElementById('lblTarget');
            let lblQty = document.getElementById('lblQty');
            let txtStarsLabel = document.getElementById('txtStarsLabel');
            let txtRateLabel = document.getElementById('txtRateLabel');
            let txtTotalLabel = document.getElementById('txtTotalLabel');
            let lblPaymentMethod = document.getElementById('lblPaymentMethod');
            let btnPayNow = document.getElementById('btnPayNow');
            
            let navShop = document.getElementById('navShop');
            let navOrders = document.getElementById('navOrders');
            let navInvite = document.getElementById('navInvite');
            let navProfile = document.getElementById('navProfile');

            if(lang === 'or') {
                banner.innerText = "⚡ Urjiileen kaffaltii booda daqiiqaa 0~5 keessatti ni qaqqabu";
                lblTarget.innerText = "Urjiicha Eenyuuf Erhita? (Maqaa fayyadamaa Telegram)";
                lblQty.innerText = "Baay'ina Urjii (max 5,000)";
                txtStarsLabel.innerText = "Urjiilee";
                txtRateLabel.innerText = "Gatiin Urjii Tokkoo";
                txtTotalLabel.innerText = "Ida'ama Kaffaltii";
                lblPaymentMethod.innerText = "Filannoo Kaffaltii Filadhu";
                btnPayNow.innerText = "Kaffaltii Raawwadhu";
                navShop.innerText = "Gabaa";
                navOrders.innerText = "Ajajoota";
                navInvite.innerText = "Affeeru";
                navProfile.innerText = "Pireovayilii";
            } else if(lang === 'en') {
                banner.innerText = "⚡ Stars will be delivered within 0~5 minutes after payment";
                lblTarget.innerText = "Send stars to (Telegram username)";
                lblQty.innerText = "Star Quantity (max 5,000)";
                txtStarsLabel.innerText = "Stars";
                txtRateLabel.innerText = "Rate per Star";
                txtTotalLabel.innerText = "Total Price";
                lblPaymentMethod.innerText = "Select Payment Method";
                btnPayNow.innerText = "Proceed to Pay";
                navShop.innerText = "Shop";
                navOrders.innerText = "Orders";
                navInvite.innerText = "Invite";
                navProfile.innerText = "Profile";
            } else {
                banner.innerText = "⚡ ከዋክብት ክፍያ ከተፈጸመ በ 0~5 ደቂቃ ውስጥ ይደርሳሉ";
                lblTarget.innerText = "ኮከቦቹን ማისთვის ይልኩ (የቴሌግራም ዩዘርናም)";
                lblQty.innerText = "የኮከብ ብዛት (max 5,000)";
                txtStarsLabel.innerText = "ኮከቦች";
                txtRateLabel.innerText = "ዋጋ በ 1 ኮከብ";
                txtTotalLabel.innerText = "የሚከፍሉት";
                lblPaymentMethod.innerText = "የክፍያ አማራጭ ይምረጡ";
                btnPayNow.innerText = "ክፍያ ፈጽም";
                navShop.innerText = "ገበያ";
                navOrders.innerText = "ትዕዛዞች";
                navInvite.innerText = "ጋብዝ";
                navProfile.innerText = "መለያ";
            }
        }
    </script>
</body>
</html>
